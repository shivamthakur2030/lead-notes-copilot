
services:
  db:
    image: postgres:18
    container_name: lead_notes_db
    environment:
      POSTGRES_DB: lead_notes_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d lead_notes_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: lead_notes_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/lead_notes_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
